name: CI
on: [ push ]
jobs:
  build_and_test:
    name: Rust Cargo Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@v4
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libdbus-1-dev pkg-config
          version: 1.0
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: cargo clippy --all-targets --all-features -- --deny warnings
      - run: cargo check
      - run: cargo check --no-default-features
      - run: cargo build --verbose --release --all-features
      - run: cargo test --verbose --all
  build_and_test_macos:
    name: Rust Cargo Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      # fontconfig/libmpv are not preinstalled on the runner, so build without
      # the text and video features; all-image-formats keeps the image codecs.
      - run: cargo clippy --all-targets --no-default-features --features all-image-formats -- --deny warnings
      - run: cargo build --verbose --no-default-features --features all-image-formats
      - run: cargo test --verbose --no-default-features --features all-image-formats
